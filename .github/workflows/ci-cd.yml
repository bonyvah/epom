name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1. LINT JOB
  lint:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache venv and tox
        uses: actions/cache@v4
        with:
          path: |
            .venv
            .tox
          key: deps-${{ runner.os }}-py3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-py3.12-
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run Linter (Ruff)
        run: poetry run tox -e lint

  # 2. TEST JOB
  test:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: true
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/epom_test
      SECRET_KEY: changemechangemechangemechangeme
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      APP_ENV: test
      RESEND_API_KEY: re_some_gibberish
      SENDER_EMAIL: onboarding@resend.dev
      APP_URL: http://localhost:8000
      AWS_ACCESS_KEY_ID: KJSDFLSJDFLSJDFLSJDF
      AWS_SECRET_ACCESS_KEY: jXUoI4T6sTAi2H5vdsRMqKTRY0FY2JbvdsRMq
      AWS_REGION: eu-central-1
      S3_BUCKET_NAME: sth-732734345328-eu-central-1-an
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: epom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache venv and tox
        uses: actions/cache@v4
        with:
          path: |
            .venv
            .tox
          key: deps-${{ runner.os }}-py3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-py3.12-
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run Tests
        run: poetry run tox -e py312

  # 3. CD (DEPLOY) JOB
  deploy:
    name: Build & Push Docker Image
    needs: [lint, test]
    # Only run on pushes/merges to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/epom
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 