name: epom
services:
  db:
    image: postgres:16-alpine
    container_name: epom-db
    environment:
      POSTGRES_USER: epom
      POSTGRES_PASSWORD: epom
      POSTGRES_DB: epom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epom"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    container_name: epom-api
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata: